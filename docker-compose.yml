services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_POSTGRES:?DB_POSTGRES is required}
      POSTGRES_USER: ${DB_USER:?DB_USER is required}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_POSTGRES}"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:8010:8000"
    env_file:
      - ${ENV_FILE:-.env}
    environment:
      DEBUG: "False"
      DB_ENGINE: postgresql
      DB_POSTGRES: ${DB_POSTGRES:?DB_POSTGRES is required}
      DB_USER: ${DB_USER:?DB_USER is required}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      DB_HOST: db
      DB_PORT: 5432
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is required}
      SERVE_STATIC_FILES: ${SERVE_STATIC_FILES:-false}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1}
      SECURE_SSL_REDIRECT: ${SECURE_SSL_REDIRECT:-true}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-true}
      CSRF_COOKIE_SECURE: ${CSRF_COOKIE_SECURE:-true}
      USE_X_FORWARDED_HOST: "True"
      AUTO_MONTHLY_REPORTS: "false"
      REPORT_SCHEDULER_RUN_ON_START: "false"
      DIFY_API_KEY: ${DIFY_API_KEY:?DIFY_API_KEY must be configured}
      WAHA_TEST_MODE_ENABLED: ${WAHA_TEST_MODE_ENABLED:-false}
      WAHA_TEST_RECIPIENT: ${WAHA_TEST_RECIPIENT:-}
      WAHA_WORKER_ENABLED: ${WAHA_WORKER_ENABLED:-false}
      WAHA_PARENT_REPORTS_ENABLED: ${WAHA_PARENT_REPORTS_ENABLED:-false}
      WAHA_PARENT_WORKER_ENABLED: ${WAHA_PARENT_WORKER_ENABLED:-false}
      WAHA_CLIENT_API_KEY_CONFIGURED: ${WAHA_API_KEY:+true}
      WAHA_SERVER_API_KEY_CONFIGURED: ${WAHA_API_KEY_HASH:+true}
      WAHA_PARENT_CLIENT_API_KEY_CONFIGURED: ${WAHA_PARENT_API_KEY:+true}
      WAHA_PARENT_SERVER_API_KEY_CONFIGURED: ${WAHA_PARENT_API_KEY_HASH:+true}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - default
      - dify_internal
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/api-info/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    volumes:
      - static_volume:/app/tabel_project/staticfiles
      - frontend_dist:/vol/frontend

  report-worker:
    profiles: ["reports"]
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    entrypoint: ["/report-worker-entrypoint.sh"]
    command: ["python", "manage.py", "process_report_queue"]
    env_file:
      - ${ENV_FILE:-.env}
    environment:
      DEBUG: "False"
      DB_ENGINE: postgresql
      DB_POSTGRES: ${DB_POSTGRES:?DB_POSTGRES is required}
      DB_USER: ${DB_USER:?DB_USER is required}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      DB_HOST: db
      DB_PORT: 5432
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is required}
      AUTO_MONTHLY_REPORTS: "false"
      REPORT_SCHEDULER_RUN_ON_START: "false"
      REPORT_WORKER_ENABLED: ${REPORT_WORKER_ENABLED:-false}
      REPORT_WORKER_MODE: continuous
      REPORT_LEGACY_QUEUE_REVIEWED: ${REPORT_LEGACY_QUEUE_REVIEWED:-false}
      DIFY_API_KEY: ${DIFY_API_KEY:?DIFY_API_KEY must be configured}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - default
      - dify_internal

  report-recovery-worker:
    profiles: ["report-recovery"]
    build:
      context: .
      dockerfile: Dockerfile
    restart: "no"
    entrypoint: ["/report-worker-entrypoint.sh"]
    command: ["python", "manage.py", "process_report_queue", "--once"]
    env_file:
      - ${ENV_FILE:-.env}
    environment:
      DEBUG: "False"
      DB_ENGINE: postgresql
      DB_POSTGRES: ${DB_POSTGRES:?DB_POSTGRES is required}
      DB_USER: ${DB_USER:?DB_USER is required}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      DB_HOST: db
      DB_PORT: 5432
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is required}
      AUTO_MONTHLY_REPORTS: "false"
      REPORT_SCHEDULER_RUN_ON_START: "false"
      REPORT_WORKER_ENABLED: ${REPORT_WORKER_ENABLED:-false}
      REPORT_WORKER_MODE: recovery
      REPORT_RECOVERY_BATCH_IDS: ${REPORT_RECOVERY_BATCH_IDS:-}
      DIFY_API_KEY: ${DIFY_API_KEY:?DIFY_API_KEY must be configured}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - default
      - dify_internal

  waha-test:
    profiles: ["waha-test"]
    image: devlikeapro/waha:arm-2026.9.2
    restart: unless-stopped
    ports:
      - "127.0.0.1:${WAHA_LOCAL_PORT:-3001}:3000"
    environment:
      WAHA_API_KEY: ${WAHA_API_KEY_HASH:-}
      WAHA_DASHBOARD_ENABLED: "true"
      WAHA_DASHBOARD_USERNAME: ${WAHA_DASHBOARD_USERNAME:-admin}
      WAHA_DASHBOARD_PASSWORD: ${WAHA_DASHBOARD_PASSWORD:?WAHA_DASHBOARD_PASSWORD is required}
      WHATSAPP_SWAGGER_ENABLED: "false"
    volumes:
      - waha_sessions:/app/.sessions
    networks:
      - default

  waha-test-worker:
    profiles: ["waha-test"]
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    entrypoint: ["python"]
    command: ["manage.py", "process_waha_test_queue"]
    env_file:
      - ${ENV_FILE:-.env}
    environment:
      DEBUG: "False"
      DB_ENGINE: postgresql
      DB_POSTGRES: ${DB_POSTGRES:?DB_POSTGRES is required}
      DB_USER: ${DB_USER:?DB_USER is required}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      DB_HOST: db
      DB_PORT: 5432
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is required}
      AUTO_MONTHLY_REPORTS: "false"
      REPORT_SCHEDULER_RUN_ON_START: "false"
      WAHA_TEST_MODE_ENABLED: ${WAHA_TEST_MODE_ENABLED:-false}
      WAHA_TEST_RECIPIENT: ${WAHA_TEST_RECIPIENT:-}
      WAHA_WORKER_ENABLED: ${WAHA_WORKER_ENABLED:-false}
      WAHA_API_URL: http://waha-test:3000
      WAHA_CLIENT_API_KEY: ${WAHA_API_KEY:-}
      WAHA_SESSION: ${WAHA_SESSION:-default}
      WAHA_TIMEOUT_SECONDS: ${WAHA_TIMEOUT_SECONDS:-30}
      WAHA_SEND_INTERVAL_SECONDS: ${WAHA_SEND_INTERVAL_SECONDS:-2}
      WAHA_UNKNOWN_AFTER_SECONDS: ${WAHA_UNKNOWN_AFTER_SECONDS:-300}
    depends_on:
      db:
        condition: service_healthy
      web:
        condition: service_healthy
      waha-test:
        condition: service_started
    networks:
      - default

  waha-parent:
    profiles: ["waha-parent"]
    image: ${WAHA_PARENT_IMAGE:-devlikeapro/waha:latest-2026.9.2@sha256:ecadb467ff9af107e7c235a955cab99ef5a1c13656cbc78aeb3e6b4d30fae7e4}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${WAHA_PARENT_LOCAL_PORT:-3002}:3000"
    environment:
      WAHA_API_KEY: ${WAHA_PARENT_API_KEY_HASH:-}
      WAHA_DASHBOARD_ENABLED: "true"
      WAHA_DASHBOARD_USERNAME: ${WAHA_PARENT_DASHBOARD_USERNAME:-admin}
      WAHA_DASHBOARD_PASSWORD: ${WAHA_PARENT_DASHBOARD_PASSWORD:?WAHA_PARENT_DASHBOARD_PASSWORD is required}
      WHATSAPP_SWAGGER_ENABLED: "false"
    volumes:
      - waha_parent_sessions:/app/.sessions
    networks:
      - default

  waha-parent-worker:
    profiles: ["waha-parent"]
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    entrypoint: ["python"]
    command: ["manage.py", "process_waha_parent_queue"]
    env_file:
      - ${ENV_FILE:-.env}
    environment:
      DEBUG: "False"
      DB_ENGINE: postgresql
      DB_POSTGRES: ${DB_POSTGRES:?DB_POSTGRES is required}
      DB_USER: ${DB_USER:?DB_USER is required}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      DB_HOST: db
      DB_PORT: 5432
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is required}
      AUTO_MONTHLY_REPORTS: "false"
      REPORT_SCHEDULER_RUN_ON_START: "false"
      WAHA_PARENT_REPORTS_ENABLED: ${WAHA_PARENT_REPORTS_ENABLED:-false}
      WAHA_PARENT_WORKER_ENABLED: ${WAHA_PARENT_WORKER_ENABLED:-false}
      WAHA_API_URL: ${WAHA_PARENT_API_URL:-http://waha-parent:3000}
      WAHA_PARENT_CLIENT_API_KEY: ${WAHA_PARENT_API_KEY:-}
      WAHA_PARENT_CLIENT_API_KEY_CONFIGURED: ${WAHA_PARENT_API_KEY:+true}
      WAHA_PARENT_SERVER_API_KEY_CONFIGURED: ${WAHA_PARENT_API_KEY_HASH:+true}
      WAHA_SESSION: ${WAHA_PARENT_SESSION:-default}
      WAHA_TIMEOUT_SECONDS: ${WAHA_PARENT_TIMEOUT_SECONDS:-30}
      WAHA_SEND_INTERVAL_SECONDS: ${WAHA_PARENT_SEND_INTERVAL_SECONDS:-2}
      WAHA_UNKNOWN_AFTER_SECONDS: ${WAHA_PARENT_UNKNOWN_AFTER_SECONDS:-300}
    depends_on:
      db:
        condition: service_healthy
      web:
        condition: service_healthy
      waha-parent:
        condition: service_started
    networks:
      - default

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443" 
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - static_volume:/vol/static:ro
      - frontend_dist:/vol/frontend:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro 

volumes:
  postgres_data:
  static_volume:
  frontend_dist:
  waha_sessions:
  waha_parent_sessions:

networks:
  dify_internal:
    external: true
    name: ${DIFY_DOCKER_NETWORK:-docker_default}
