    - data:
        code: "\"\"\"Academy formatter for monthly_send / student_weekly_reports_v4. No HTTP.\"\"\"\n\nimport json\nimport\
          \ math\nimport re\n\n\nTEMPLATE_NAME = \"student_weekly_reports_v4\"\n\n\ndef text(value, field, required=False):\n\
          \    if value is None:\n        value = \"\"\n    if not isinstance(value, str):\n        raise ValueError(f\"{field}:\
          \ требуется строка.\")\n    result = \" \".join(value.split())\n    if required and not result:\n        raise ValueError(f\"\
          {field}: обязательное поле не заполнено.\")\n    return result\n\n\ndef number(value, field, integer=False):\n \
          \   if isinstance(value, bool) or not isinstance(value, (int, float, str)):\n        raise ValueError(f\"{field}:\
          \ требуется неотрицательное число.\")\n    try:\n        result = float(value)\n    except (ValueError, OverflowError):\n\
          \        raise ValueError(f\"{field}: требуется неотрицательное число.\")\n    if not math.isfinite(result) or result\
          \ < 0:\n        raise ValueError(f\"{field}: требуется конечное неотрицательное число.\")\n    if integer and not\
          \ result.is_integer():\n        raise ValueError(f\"{field}: требуется целое число.\")\n    return int(result) if\
          \ result.is_integer() else result\n\n\ndef phone(value):\n    value = text(value, \"recipient_phone\", required=True)\n\
          \    if not re.fullmatch(r\"\\+?[0-9 ()-]+\", value):\n        raise ValueError(\"recipient_phone: некорректная\
          \ запись номера.\")\n    result = re.sub(r\"[^0-9]\", \"\", value)\n    if not re.fullmatch(r\"[1-9][0-9]{7,14}\"\
          , result):\n        raise ValueError(\"recipient_phone: нужен код страны и от 8 до 15 цифр.\")\n    return result\n\
          \n\ndef build_payload(**kwargs):\n    student_name = text(kwargs.get(\"student_name\"), \"student_name\", required=True)\n\
          \    group_name = text(kwargs.get(\"group_name\"), \"group_name\", required=True)\n    recipient_name = text(kwargs.get(\"\
          recipient_name\"), \"recipient_name\")\n    mentor_name = text(kwargs.get(\"mentor_name\"), \"mentor_name\")\n \
          \   clean_phone = phone(kwargs.get(\"recipient_phone\"))\n    month = text(kwargs.get(\"month\"), \"month\", required=True)\n\
          \    if not re.fullmatch(r\"[0-9]{4}-(0[1-9]|1[0-2])\", month):\n        raise ValueError(\"month: требуется YYYY-MM,\
          \ например 2026-09.\")\n    if month.startswith(\"0000-\"):\n        raise ValueError(\"month: некорректный год.\"\
          )\n    report = kwargs.get(\"report\")\n    if not isinstance(report, dict):\n        raise ValueError(\"report\
          \ должен быть JSON-объектом.\")\n    if report.get(\"organization\") not in (None, \"academy\"):\n        raise\
          \ ValueError(\"Workflow предназначен для академии.\")\n    if report.get(\"main_group\") or report.get(\"subjects\"\
          ):\n        raise ValueError(\"Колледжный формат не поддерживается workflow академии.\")\n    period = report.get(\"\
          period\") or {}\n    if not isinstance(period, dict):\n        raise ValueError(\"report.period должен быть объектом.\"\
          )\n    for nested_month in (report.get(\"month\"), period.get(\"month\")):\n        if nested_month is not None\
          \ and nested_month != month:\n            raise ValueError(\"month не совпадает с месяцем в report.\")\n    student\
          \ = report.get(\"student\") or {}\n    if not isinstance(student, dict):\n        raise ValueError(\"report.student\
          \ должен быть объектом.\")\n    if student.get(\"full_name\") and text(student[\"full_name\"], \"report.student.full_name\"\
          ) != student_name:\n        raise ValueError(\"student_name не совпадает с именем в report.student.\")\n    if student.get(\"\
          parent_phone\") and phone(student[\"parent_phone\"]) != clean_phone:\n        raise ValueError(\"recipient_phone\
          \ не совпадает с номером в report.student.\")\n\n    counts = {\n        key: number(kwargs.get(key), key, integer=True)\n\
          \        for key in (\"total_five\", \"total_four\", \"total_three\", \"total_two\", \"attendance_count\", \"absence_count\"\
          )\n    }\n    average_grade = number(kwargs.get(\"average_grade\"), \"average_grade\")\n    attendance_rate = number(kwargs.get(\"\
          attendance_rate\"), \"attendance_rate\")\n    if attendance_rate > 100:\n        raise ValueError(\"attendance_rate\
          \ должен быть от 0 до 100.\")\n\n    grade_lines = []\n    for score, key in ((5, \"total_five\"), (4, \"total_four\"\
          ), (3, \"total_three\"), (2, \"total_two\")):\n        if counts[key] > 0:\n            grade_lines.append(f\"“{score}”\
          \ – {counts[key]} даана\")\n    # Visible placeholders replace the old invisible U+200E marks.\n    grade_lines.extend([\"\
          —\"] * (4 - len(grade_lines)))\n    absence_count = counts[\"absence_count\"]\n    summary = report.get(\"summary\")\n    if not isinstance(summary, dict):\n        raise ValueError(\"report.summary должен быть объектом.\")\n    if number(summary.get(\"absence_count\"), \"report.summary.absence_count\", integer=True) != absence_count:\n        raise ValueError(\"absence_count не совпадает с report.summary.\")\n    unmarked_count = number(summary.get(\"unmarked_count\"), \"report.summary.unmarked_count\", integer=True)\n    total_lessons = number(summary.get(\"total_lessons\"), \"report.summary.total_lessons\", integer=True)\n    marked_lessons = number(summary.get(\"marked_lessons_count\"), \"report.summary.marked_lessons_count\", integer=True)\n    if marked_lessons + unmarked_count != total_lessons:\n        raise ValueError(\"Количество отмеченных и неотмеченных занятий не совпадает с итогом.\")\n    absence_text = (\n        f\"Белгиленген калуулар (Н): {absence_count}; \"\n        f\"белги коюлбаган сабактар: {unmarked_count}.\"\n    )\n    if summary.get(\"attendance_status_text\") != absence_text:\n        raise ValueError(\"Текст посещаемости не совпадает с report.summary.\")\n    values = [group_name, student_name, month, *grade_lines, absence_text]\n    whatsapp\
          \ = {\n        \"messaging_product\": \"whatsapp\",\n        \"to\": clean_phone,\n        \"type\": \"template\"\
          ,\n        \"template\": {\n            \"name\": TEMPLATE_NAME,\n            \"language\": {\"code\": \"ky_KG\"\
          },\n            \"components\": [{\"type\": \"body\", \"parameters\": [{\"type\": \"text\", \"text\": value} for\
          \ value in values]}],\n        },\n    }\n    backend = {\n        \"event\": \"student_monthly_report_result\"\
          ,\n        \"channel\": \"meta_whatsapp\",\n        \"student_name\": student_name,\n        \"recipient_name\"\
          : recipient_name,\n        \"recipient_phone\": clean_phone,\n        \"group_name\": group_name,\n        \"mentor_name\"\
          : mentor_name,\n        \"month\": month,\n        \"average_grade\": average_grade,\n        \"attendance_rate\"\
          : attendance_rate,\n        **counts,\n        \"report\": report,\n        \"meta_request\": whatsapp,\n    }\n\
          \    return {\n        \"clean_phone\": clean_phone,\n        \"grade_line_1\": grade_lines[0],\n        \"grade_line_2\"\
          : grade_lines[1],\n        \"grade_line_3\": grade_lines[2],\n        \"grade_line_4\": grade_lines[3],\n      \
          \  \"absence_text\": absence_text,\n        \"backend_payload\": json.dumps(backend, ensure_ascii=False, allow_nan=False),\n\
          \        \"whatsapp_payload\": json.dumps(whatsapp, ensure_ascii=False, allow_nan=False),\n    }\n\n\ndef main(send_enabled=\"\
          false\", **kwargs):\n    if str(send_enabled).strip().lower() != \"true\":\n        raise ValueError(\"Отправка\
          \ академии выключена: ACADEMY_SEND_ENABLED=false.\")\n    return build_payload(**kwargs)\n"
        code_language: python3
        outputs:
